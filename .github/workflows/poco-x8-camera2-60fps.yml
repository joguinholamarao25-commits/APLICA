name: Build POCO X8 Pro Raw Camera2 60FPS

on:
  pull_request:
    paths:
      - 'poco60/**'
      - '.github/workflows/poco-x8-camera2-60fps.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: poco60
        run: gradle :app:assembleDebug --stacktrace

      - name: SHA256
        run: sha256sum poco60/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: POCO-X8-Pro-Raw-Camera2-60FPS
          path: poco60/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
