name: Build POCO X8 Pro Aperture 60FPS

'on':
  push:
    branches: [poco-x8-aperture-60fps]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clone Aperture branch 17
        run: git clone --depth 1 --branch 17 https://github.com/halcyonproject/packages_apps_Aperture.git aperture

      - name: Add POCO X8 Pro 60 FPS modes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("aperture/app/src/main/res/values/config.xml")
          s = p.read_text()
          marker = '    <string-array name="config_additionalVideoConfigurations">\n        <!-- No additional configuration is added by default. -->\n    </string-array>'
          replacement = '    <string-array name="config_additionalVideoConfigurations">\n        <item>0</item> <item>fhd|uhd</item> <item>60</item>\n        <item>2</item> <item>fhd|uhd</item> <item>60</item>\n        <item>4</item> <item>fhd|uhd</item> <item>60</item>\n    </string-array>'
          if marker not in s:
              raise SystemExit("additional video configuration block not found")
          p.write_text(s.replace(marker, replacement))
          PY

      - name: Verify MediaTek HFPS support and forced modes
        run: |
          grep -R "com.mediatek.streamingfeature.hfpsMode" -n aperture/app/src/main/java
          grep -n "fhd|uhd" aperture/app/src/main/res/values/config.xml

      - name: Build APK
        working-directory: aperture
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: SHA256
        run: sha256sum aperture/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aperture-POCO-X8-Pro-60FPS
          path: aperture/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
